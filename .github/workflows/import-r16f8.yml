name: Import R16F8 source tree
on:
  push:
    paths:
      - '.github/workflows/import-r16f8.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack source archive into browsable project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/voygerM5-import
          unzip -oq source/SV_R16F8_WARP_FX_COM16.zip -d /tmp/voygerM5-import
          root=/tmp/voygerM5-import/voygerM5_R16F8
          test -f "$root/firmware/src/main.cpp"
          test -f "$root/firmware/include/warp_timing.hpp"
          cp -a "$root/firmware" .
          cp -a "$root/tests" .
          cp -a "$root/tools" .
          cp "$root/"*.cmd .
          cp "$root/TEST_REPORT.txt" .
          git add firmware tests tools '*.cmd' TEST_REPORT.txt
          if git diff --cached --quiet; then
            echo 'Source tree already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'source: unpack browsable R16 FIX8 firmware and tests'
          git push origin HEAD:main
