; Independent voygerM5 StopWatch startup. No 00_smoke/board.cpp/sample clone.
; Dedicated ESP32-S3R8 board manifest lives in firmware/boards/.
; Keep known R16 USB and paired M5 0.3.0 behavior (do not downgrade to R13 libraries).
; NEVER flash partition table/bootloader/filesystem; guarded APP-ONLY OTA0 only.
[platformio]
boards_dir = boards

[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = voygerm5-stopwatch
framework = arduino
build_unflags =
    -DARDUINO_USB_MODE=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 5177344
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_ID=30
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.3.0
    https://github.com/m5stack/M5GFX.git#0.3.0
