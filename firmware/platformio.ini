; R16F4: same OTA0 recovery layout, updating ONLY paired M5 libraries and DMA fences.
; NEVER flash partition table/bootloader/filesystem, only checked ota_0 at 0x20000.
; R16F3 flight code unchanged except for safe PSRAM DMA transfer synchronization.
[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino
build_unflags =
    -DARDUINO_USB_MODE=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 5177344
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_ID=30
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.3.0
    https://github.com/m5stack/M5GFX.git#0.3.0
